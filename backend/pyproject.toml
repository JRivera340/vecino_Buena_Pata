[project]
name = "vecino-buena-pata-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "qrcode[pil]>=7.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "boto3>=1.35",
    "httpx>=0.27",
    "Pillow>=10.4",
]

[project.optional-dependencies]
# Solo para regenerar el GeoJSON de localidades (scripts/kmz_a_geojson.py); el servidor no lo usa.
geo = [
    "shapely>=2.0",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
