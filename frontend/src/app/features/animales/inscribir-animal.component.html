<div class="pantalla-inscripcion">
  <div class="tarjeta-inscripcion">
    <h1>Inscribir un vecino</h1>

    @if (exito()) {
      <div class="mensaje-exito">
        <p>{{ nombre() }} quedo registrado como candidato.</p>
        <p class="nota">Esto todavia no lo convierte en Vecino Buena Pata: falta que un veterinario lo valide.</p>
        <button type="button" (click)="volverAlMapa()">Volver al mapa</button>
      </div>
    } @else {
      <form (ngSubmit)="inscribir()">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" [ngModel]="nombre()" (ngModelChange)="nombre.set($event)" required />

        <label for="sexo">Sexo</label>
        <select id="sexo" name="sexo" [ngModel]="sexo()" (ngModelChange)="sexo.set($event)">
          <option value="MACHO">Macho</option>
          <option value="HEMBRA">Hembra</option>
        </select>

        <label for="tamano">Tamano</label>
        <select id="tamano" name="tamano" [ngModel]="tamano()" (ngModelChange)="tamano.set($event)">
          <option value="PEQUENO">Pequeno</option>
          <option value="MEDIANO">Mediano</option>
          <option value="GRANDE">Grande</option>
        </select>

        <label for="edad">Edad estimada (anos, opcional)</label>
        <input
          id="edad"
          name="edad"
          type="number"
          min="0"
          [ngModel]="edadEstimada()"
          (ngModelChange)="edadEstimada.set($event)"
        />

        <label for="descripcion">Descripcion</label>
        <textarea id="descripcion" name="descripcion" [ngModel]="descripcion()" (ngModelChange)="descripcion.set($event)"></textarea>

        <label for="barrio">Barrio</label>
        <input id="barrio" name="barrio" type="text" [ngModel]="barrio()" (ngModelChange)="barrio.set($event)" required />

        <label for="comunidad">Comunidad que lo inscribe</label>
        <select id="comunidad" name="comunidad" [ngModel]="comunidadId()" (ngModelChange)="comunidadId.set($event)">
          <option [ngValue]="null">Selecciona una comunidad</option>
          @for (comunidad of comunidades(); track comunidad.id) {
            <option [ngValue]="comunidad.id">{{ comunidad.nombre }}</option>
          }
        </select>

        <label>Foto (obligatoria)</label>
        <input type="file" accept="image/*" (change)="seleccionarFoto($event)" />

        <label>Ubicacion en el territorio (haz clic en el mapa)</label>
        <app-mapa-territorio
          class="mini-mapa"
          [seleccionable]="true"
          (ubicacionSeleccionada)="seleccionarUbicacion($event)"
        ></app-mapa-territorio>

        @if (error()) {
          <p class="mensaje-error">{{ error() }}</p>
        }

        <button type="submit" [disabled]="enviando()">
          {{ enviando() ? 'Guardando...' : 'Inscribir' }}
        </button>
      </form>
    }
  </div>
</div>
