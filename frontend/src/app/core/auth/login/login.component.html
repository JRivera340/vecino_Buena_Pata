<div class="pantalla-ingreso">
  <form class="tarjeta-ingreso" (ngSubmit)="ingresar()">
    <h1>Vecino Buena Pata</h1>
    <p class="subtitulo">Ingresa con tu usuario del programa.</p>

    <label for="username">Usuario</label>
    <input
      id="username"
      name="username"
      type="text"
      [ngModel]="username()"
      (ngModelChange)="username.set($event)"
      required
    />

    <label for="password">Contrasena</label>
    <input
      id="password"
      name="password"
      type="password"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      required
    />

    @if (error()) {
      <p class="mensaje-error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
