name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vbp
          POSTGRES_PASSWORD: vbp
          POSTGRES_DB: vbp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vbp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VBP_TEST_DATABASE_URL: postgresql+psycopg://vbp:vbp@localhost:5432/vbp_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx ng test --watch=false
